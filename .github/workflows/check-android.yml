name: Check Android runner

on:
  workflow_run:
    workflows: [Build RenPy-owned Android runner]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful APK build run ID (blank uses latest main build)
        required: false
        type: string
      startup_mode:
        description: Expected APK startup mode
        type: choice
        options: [story, app]
        default: story
  workflow_call:
    inputs:
      build_run:
        description: APK artifact run ID supplied by the integration workflow
        required: true
        type: string
      startup_mode:
        description: Expected APK startup mode
        type: string
        default: story
  push:
    branches: [main, integration/abc-app-recipes]
    paths:
      - .github/workflows/check-android.yml
      - scripts/device_smoke.py
      - scripts/records_device_checks.py
      - scripts/media_output.py
      - scripts/check_apk_source.py
      - scripts/check_apk_artifact.py
      - scripts/check_device_acceptance.py
      - scripts/check_apk.py
      - scripts/startup_config.py

permissions:
  contents: read
  actions: read

concurrency:
  group: android-device-check
  cancel-in-progress: false

jobs:
  device:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: 1080p
            width: 1080
            height: 1920
            density: 420
    name: Android ${{ matrix.profile }}
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-build/android-user
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-build/android-user/avd
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Download the built APK and record its source
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id || inputs.build_run }}
          STARTUP_MODE: ${{ inputs.startup_mode || 'story' }}
        run: |
          github_read() {
            local response attempt read_status
            for attempt in 1 2 3; do
              if response=$(gh api --method GET "$@"); then
                printf '%s\n' "$response"
                return 0
              else
                read_status=$?
              fi
              if test "$attempt" -eq 3; then return "$read_status"; fi
              echo "GitHub API read failed; retrying in 5 seconds (attempt $attempt of 3)." >&2
              sleep 5
            done
          }
          artifact_run="$BUILD_RUN"
          if test -z "$artifact_run"; then
            artifact_run=$(github_read "repos/$GITHUB_REPOSITORY/actions/workflows/build-android.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          mkdir -p .android-build/device-check
          github_read "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run" > .android-build/device-check/build-run.json
          python3 scripts/check_apk_artifact.py --run-metadata .android-build/device-check/build-run.json --repository "$GITHUB_REPOSITORY" --current-run-id "$GITHUB_RUN_ID"
          apk_source=$(jq -r .head_sha .android-build/device-check/build-run.json)
          harness_source=$(git rev-parse HEAD)
          github_read "repos/$GITHUB_REPOSITORY/compare/$apk_source...$harness_source" > .android-build/device-check/source-comparison.json
          python3 scripts/check_apk_source.py .android-build/device-check/source-comparison.json
          github_read "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run/artifacts?per_page=100" > .android-build/device-check/artifacts.json
          # Automatic checks follow the mode of the completed direct build.
          # Explicit dispatches and integration calls require their requested mode.
          if test "$GITHUB_EVENT_NAME" = workflow_run && jq -e '.artifacts | any(.expired == false and .name == "runner-app-emulator-apk")' .android-build/device-check/artifacts.json >/dev/null; then
            STARTUP_MODE=app
          fi
          artifact_prefix=runner
          if test "$STARTUP_MODE" = app; then artifact_prefix=runner-app; fi
          artifact_name=$(jq -r --arg emulator "$artifact_prefix-emulator-apk" --arg universal "$artifact_prefix-apk" '[.artifacts[] | select(.expired == false and (.name == $emulator or .name == $universal))] | sort_by(if .name == $emulator then 0 else 1 end) | .[0].name // empty' .android-build/device-check/artifacts.json)
          test -n "$artifact_name"
          gh run download "$artifact_run" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir .android-build/download
          mkdir -p .android-build/outputs .android-build/device-check
          apk_file=runner-debug.apk
          apk_abi=universal
          if test "$artifact_name" = "$artifact_prefix-emulator-apk"; then
            apk_file=runner-debug-x86_64.apk
            apk_abi=x86_64
          fi
          download_root=.android-build/download
          if ! test -f "$download_root/$apk_file"; then download_root="$download_root/outputs"; fi
          python3 scripts/check_apk_artifact.py --run-metadata .android-build/device-check/build-run.json --repository "$GITHUB_REPOSITORY" --current-run-id "$GITHUB_RUN_ID" --apk "$download_root/$apk_file" --receipt "$download_root/apk-builds.json" --host-receipt "$download_root/host-tests.json" --startup-mode "$STARTUP_MODE" --abi "$apk_abi"
          cp "$download_root/$apk_file" ".android-build/outputs/$apk_file"
          cp "$download_root/apk-builds.json" .android-build/device-check/build-receipt.json
          cp "$download_root/host-tests.json" .android-build/device-check/host-tests.json
          echo "mode=$STARTUP_MODE" >> "$GITHUB_OUTPUT"
          echo "source=$apk_source" >> "$GITHUB_OUTPUT"
          echo "file=$apk_file" >> "$GITHUB_OUTPUT"
          echo "abi=$apk_abi" >> "$GITHUB_OUTPUT"
          echo "APK artifact: $artifact_name; ABI: $apk_abi; startup: $STARTUP_MODE" | tee .android-build/device-check/apk-selection.txt
          echo "APK source: $apk_source (run $artifact_run)" | tee .android-build/device-check/build-source.txt
          echo "Harness source: $(git rev-parse HEAD)" | tee -a .android-build/device-check/build-source.txt
          if test -f .android-build/download/emulator.log; then tail -n 60 .android-build/download/emulator.log; fi
      - name: Prepare Android emulator tools
        run: |
          sdk_tools_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if ! test -x "$sdk_tools_bin/sdkmanager"; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if test -x "$candidate/sdkmanager"; then sdk_tools_bin="$candidate"; break; fi
            done
          fi
          test -x "$sdk_tools_bin/sdkmanager"
          echo "$sdk_tools_bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          "$sdk_tools_bin/sdkmanager" "emulator" "system-images;android-36;google_apis;x86_64"
          emulator_tool="$ANDROID_HOME/emulator/emulator"
          echo "RUNNER_EMULATOR=$emulator_tool" >> "$GITHUB_ENV"
          "$emulator_tool" -no-window -no-audio -version > .android-build/device-check/emulator-version.txt
          mkdir -p "$ANDROID_AVD_HOME"
          "$sdk_tools_bin/avdmanager" create avd --force --name runner --device pixel_2 --path "$ANDROID_AVD_HOME/runner.avd" --package "system-images;android-36;google_apis;x86_64"
          python3 - <<'PY'
          import hashlib
          import json
          import mmap
          import os
          import shutil
          from pathlib import Path

          # API 36 mounts vendor from the dynamic partitions in system.img.
          # Change its immutable buffer value in a separate image before boot.
          original = Path(os.environ["ANDROID_HOME"]) / "system-images/android-36/google_apis/x86_64/system.img"
          property_line = b"ro.hardware.audio.tinyalsa.period_size_multiplier=2\n"
          image_dir = Path(".android-build/emulator-image").resolve()
          image_dir.mkdir()
          for source in original.parent.iterdir():
              if source.name != "system.img":
                  (image_dir / source.name).symlink_to(source)
          configured = image_dir / "system.img"
          shutil.copyfile(original, configured)
          with configured.open("r+b") as stream, mmap.mmap(stream.fileno(), 0) as image:
              offset = image.find(property_line)
              assert offset >= 0 and image.find(property_line, offset + 1) < 0, (
                  "Unexpected emulator vendor audio configuration")
              image[offset + len(property_line) - 2] = ord("8")
              image.flush()
          def checksum(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          config = Path(".android-build/android-user/avd/runner.avd/config.ini")
          settings = {
              "image.sysdir.1": str(image_dir),
              "hw.lcd.width": "${{ matrix.width }}", "hw.lcd.height": "${{ matrix.height }}",
              "hw.lcd.density": "${{ matrix.density }}", "hw.cpu.ncore": "2",
              "skin.name": "${{ matrix.width }}x${{ matrix.height }}", "skin.dynamic": "yes",
              "hw.audioOutput": "yes", "hw.audioInput": "no",
          }
          lines = config.read_text().splitlines()
          updated = []
          for line in lines:
              key = line.split("=", 1)[0].strip()
              updated.append(key + "=" + settings.pop(key) if key in settings else line)
          updated.extend(key + "=" + value for key, value in settings.items())
          config.write_text("\n".join(updated) + "\n")
          profile = {
              "profile": "${{ matrix.profile }}", "display_pixels": [${{ matrix.width }}, ${{ matrix.height }}],
              "density_dpi": ${{ matrix.density }}, "guest_cpu_cores": 2, "gpu": "swiftshader",
              "vulkan": False, "host_audio_rate": 48000, "host_audio_channels": 2,
              "audio_period_size_multiplier": 8,
              "system_original_sha256": checksum(original),
              "system_image_sha256": checksum(configured),
              "audio_output": "QEMU WAV renderer", "sound_card": "virtio",
              "system_image": "android-36/google_apis/x86_64",
              "emulator": Path(".android-build/device-check/emulator-version.txt").read_text().splitlines()[0],
              "camera": "disabled",
          }
          Path(".android-build/device-check/emulator-profile.json").write_text(
              json.dumps(profile, indent=2) + "\n")
          print("Configured Android emulator: " + json.dumps(profile, sort_keys=True))
          PY
          test -f "$ANDROID_AVD_HOME/runner.ini"
          "$emulator_tool" -list-avds
          "$emulator_tool" -no-window -no-audio -version
          if test -e /dev/kvm; then sudo chown "$USER" /dev/kvm; fi
      - name: Run both runtimes on Android
        env:
          QEMU_AUDIO_DRV: wav
          QEMU_AUDIO_DAC_FIXED_FREQ: 48000
          QEMU_WAV_FREQUENCY: 48000
          QEMU_WAV_PATH: ${{ github.workspace }}/.android-build/emulator-output.wav
          RUNNER_AUDIO_WAVE: ${{ github.workspace }}/.android-build/emulator-output.wav
          RUNNER_AUDIO_PERIOD_MULTIPLIER: 8
          RUNNER_EMULATOR_LOG: .android-build/emulator.log
        run: |
          adb start-server
          # Capture the real virtual sound-card output directly; a growing WAV
          # also works with the headless binary, without a host sound server.
          "$RUNNER_EMULATOR" -avd runner -sysdir "$PWD/.android-build/emulator-image" -skin ${{ matrix.width }}x${{ matrix.height }} -no-window -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader -memory 2048 -camera-back none -camera-front none -feature VirtioSndCard,-Vulkan -debug audio > .android-build/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 scripts/device_smoke.py ".android-build/outputs/${{ steps.apk.outputs.file }}" --abi "${{ steps.apk.outputs.abi }}" --startup-mode "${{ steps.apk.outputs.mode }}" --source-sha "${{ steps.apk.outputs.source }}" --expected-display ${{ matrix.width }} ${{ matrix.height }} ${{ matrix.density }}
      - name: Require complete device acceptance without skips
        if: always()
        run: |
          python3 scripts/check_device_acceptance.py .android-build/device-check --startup-mode "${{ steps.apk.outputs.mode }}" --source-sha "${{ steps.apk.outputs.source }}"
      - name: Show emulator diagnostics
        if: failure()
        run: |
          if test -f .android-build/emulator.log; then
            tail -n 100 .android-build/emulator.log
          fi
      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner${{ (steps.apk.outputs.mode || inputs.startup_mode) == 'app' && '-app' || '' }}-device-check-${{ matrix.profile }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .android-build/device-check/
            .android-build/emulator.log
            .android-build/emulator-output.wav
