name: Check Android runner

on:
  workflow_run:
    workflows: [Build RenPy-owned Android runner]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful APK build run ID (blank uses latest main build)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - .github/workflows/check-android.yml
      - scripts/device_smoke.py
      - scripts/media_output.py
      - scripts/check_apk_source.py

permissions:
  contents: read
  actions: read

concurrency:
  group: android-device-check
  cancel-in-progress: false

jobs:
  device:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: 1080p
            width: 1080
            height: 1920
            density: 420
    name: Android ${{ matrix.profile }}
    env:
      ANDROID_USER_HOME: ${{ github.workspace }}/.android-build/android-user
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android-build/android-user/avd
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: false
          ref: ${{ github.sha }}
      - name: Download the built APK and record its source
        id: apk
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id || inputs.build_run }}
        run: |
          github_read() {
            local response attempt read_status
            for attempt in 1 2 3; do
              if response=$(gh api --method GET "$@"); then
                printf '%s\n' "$response"
                return 0
              else
                read_status=$?
              fi
              if test "$attempt" -eq 3; then return "$read_status"; fi
              echo "GitHub API read failed; retrying in 5 seconds (attempt $attempt of 3)." >&2
              sleep 5
            done
          }
          artifact_run="$BUILD_RUN"
          if test -z "$artifact_run"; then
            artifact_run=$(github_read "repos/$GITHUB_REPOSITORY/actions/workflows/build-android.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          mkdir -p .android-build/device-check
          apk_source=$(github_read "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run" --jq '.head_sha')
          harness_source=$(git rev-parse HEAD)
          github_read "repos/$GITHUB_REPOSITORY/compare/$apk_source...$harness_source" > .android-build/device-check/source-comparison.json
          if ! python3 scripts/check_apk_source.py .android-build/device-check/source-comparison.json; then
            echo "compatible=false" >> "$GITHUB_OUTPUT"
            echo "Device check deferred until a compatible APK build finishes." | tee .android-build/device-check/build-source.txt
            echo "APK source: $apk_source; harness source: $harness_source" | tee -a .android-build/device-check/build-source.txt
            echo "Device verification awaits a compatible APK from the current build." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "compatible=true" >> "$GITHUB_OUTPUT"
          artifact_name=$(github_read "repos/$GITHUB_REPOSITORY/actions/runs/$artifact_run/artifacts" --jq '[.artifacts[] | select(.expired == false and (.name == "runner-emulator-apk" or .name == "runner-apk" or .name == "renpy-owned-runner"))] | sort_by(if .name == "runner-emulator-apk" then 0 elif .name == "runner-apk" then 1 else 2 end) | .[0].name // empty')
          test -n "$artifact_name"
          gh run download "$artifact_run" --repo "$GITHUB_REPOSITORY" --name "$artifact_name" --dir .android-build/download
          mkdir -p .android-build/outputs .android-build/device-check
          apk_file=runner-debug.apk
          apk_abi=universal
          if test "$artifact_name" = runner-emulator-apk; then
            apk_file=runner-debug-x86_64.apk
            apk_abi=x86_64
          fi
          if test -f ".android-build/download/$apk_file"; then
            cp ".android-build/download/$apk_file" .android-build/outputs/runner-debug.apk
          else
            cp ".android-build/download/outputs/$apk_file" .android-build/outputs/runner-debug.apk
          fi
          echo "abi=$apk_abi" >> "$GITHUB_OUTPUT"
          echo "APK artifact: $artifact_name; ABI: $apk_abi" | tee .android-build/device-check/apk-selection.txt
          echo "APK source: $apk_source (run $artifact_run)" | tee .android-build/device-check/build-source.txt
          echo "Harness source: $(git rev-parse HEAD)" | tee -a .android-build/device-check/build-source.txt
          if test -f .android-build/download/emulator.log; then tail -n 60 .android-build/download/emulator.log; fi
      - name: Prepare Android emulator tools
        if: steps.apk.outputs.compatible == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxcb-cursor0 libxkbcommon-x11-0
          sdk_tools_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if ! test -x "$sdk_tools_bin/sdkmanager"; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if test -x "$candidate/sdkmanager"; then sdk_tools_bin="$candidate"; break; fi
            done
          fi
          test -x "$sdk_tools_bin/sdkmanager"
          echo "$sdk_tools_bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          "$sdk_tools_bin/sdkmanager" "emulator" "system-images;android-36;google_apis;x86_64"
          emulator_tool="$ANDROID_HOME/emulator/emulator"
          echo "RUNNER_EMULATOR=$emulator_tool" >> "$GITHUB_ENV"
          "$emulator_tool" -no-window -no-audio -version > .android-build/device-check/emulator-version.txt
          mkdir -p "$ANDROID_AVD_HOME"
          "$sdk_tools_bin/avdmanager" create avd --force --name runner --device pixel_2 --path "$ANDROID_AVD_HOME/runner.avd" --package "system-images;android-36;google_apis;x86_64"
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = Path(".android-build/android-user/avd/runner.avd/config.ini")
          settings = {
              "hw.lcd.width": "${{ matrix.width }}", "hw.lcd.height": "${{ matrix.height }}",
              "hw.lcd.density": "${{ matrix.density }}", "hw.cpu.ncore": "2",
              "skin.name": "${{ matrix.width }}x${{ matrix.height }}", "skin.dynamic": "yes",
              "hw.audioOutput": "yes", "hw.audioInput": "no",
          }
          lines = config.read_text().splitlines()
          updated = []
          for line in lines:
              key = line.split("=", 1)[0].strip()
              updated.append(key + "=" + settings.pop(key) if key in settings else line)
          updated.extend(key + "=" + value for key, value in settings.items())
          config.write_text("\n".join(updated) + "\n")
          profile = {
              "profile": "${{ matrix.profile }}", "display_pixels": [${{ matrix.width }}, ${{ matrix.height }}],
              "density_dpi": ${{ matrix.density }}, "guest_cpu_cores": 2, "gpu": "swiftshader",
              "vulkan": False, "host_audio_rate": 48000, "host_audio_channels": 2,
              "audio_period_size_multiplier": 8,
              "audio_output": "QEMU WAV renderer", "sound_card": "virtio",
              "system_image": "android-36/google_apis/x86_64",
              "emulator": Path(".android-build/device-check/emulator-version.txt").read_text().splitlines()[0],
              "camera": "disabled",
          }
          Path(".android-build/device-check/emulator-profile.json").write_text(
              json.dumps(profile, indent=2) + "\n")
          print("Configured Android emulator: " + json.dumps(profile, sort_keys=True))
          PY
          test -f "$ANDROID_AVD_HOME/runner.ini"
          "$emulator_tool" -list-avds
          "$emulator_tool" -no-window -no-audio -version
          if test -e /dev/kvm; then sudo chown "$USER" /dev/kvm; fi
      - name: Run both runtimes on Android
        if: steps.apk.outputs.compatible == 'true'
        env:
          QEMU_AUDIO_DRV: wav
          QEMU_AUDIO_DAC_FIXED_FREQ: 48000
          QEMU_WAV_FREQUENCY: 48000
          QEMU_WAV_PATH: ${{ github.workspace }}/.android-build/emulator-output.wav
          RUNNER_AUDIO_WAVE: ${{ github.workspace }}/.android-build/emulator-output.wav
          RUNNER_AUDIO_PERIOD_MULTIPLIER: 8
          RUNNER_EMULATOR_LOG: .android-build/emulator.log
        run: |
          adb start-server
          # Capture the real virtual sound-card output directly; a growing WAV
          # also works with the headless binary, without a host sound server.
          "$RUNNER_EMULATOR" -avd runner -skin ${{ matrix.width }}x${{ matrix.height }} -no-window -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader -memory 2048 -camera-back none -camera-front none -feature VirtioSndCard,-Vulkan -debug audio > .android-build/emulator.log 2>&1 &
          emulator_pid=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill "$emulator_pid" 2>/dev/null || true' EXIT
          python3 scripts/device_smoke.py .android-build/outputs/runner-debug.apk --abi "${{ steps.apk.outputs.abi }}" --expected-display ${{ matrix.width }} ${{ matrix.height }} ${{ matrix.density }}
      - name: Show emulator diagnostics
        if: failure() && steps.apk.outputs.compatible == 'true'
        run: |
          if test -f .android-build/emulator.log; then
            tail -n 100 .android-build/emulator.log
          fi
      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-device-check-${{ matrix.profile }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            .android-build/device-check/
            .android-build/emulator.log
            .android-build/emulator-output.wav
