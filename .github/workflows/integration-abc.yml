name: Verify integrated app recipes

on:
  push:
    branches: [main, integration/abc-app-recipes, integration/app-starter]
    paths:
      - .github/workflows/**
      - build_android.py
      - prepare.py
      - project.py
      - create_project.py
      - templates/app/**
      - sdk-lock.json
      - requirements-build.txt
      - android/**
      - assets/**
      - flutter/**
      - game/**
      - runtime/**
      - examples/renpy/**
      - tests/**
      - scripts/**
  workflow_dispatch:
    inputs:
      build_app_starter:
        description: Validate both explicit startup modes in one batch
        type: boolean
        default: true
      verify_project_release:
        description: Build and run a generated project in release mode
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    uses: ./.github/workflows/check-runtime.yml
  build:
    uses: ./.github/workflows/build-android.yml
    with:
      verify_flutter_reuse: true
      build_app_starter: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.ref == 'refs/heads/integration/app-starter' || inputs.build_app_starter == true || inputs.verify_project_release == true }}
      verify_project_release: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.verify_project_release == true }}
  device-story:
    needs: [runtime, build]
    uses: ./.github/workflows/check-android.yml
    with:
      build_run: ${{ format('{0}', github.run_id) }}
      startup_template: story
      require_receipts: true
  device-app:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.ref == 'refs/heads/integration/app-starter' || inputs.build_app_starter == true || inputs.verify_project_release == true
    needs: [runtime, build, device-story]
    uses: ./.github/workflows/check-android.yml
    with:
      build_run: ${{ format('{0}', github.run_id) }}
      startup_template: app
      require_receipts: true
      verify_project_release: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.verify_project_release == true }}
