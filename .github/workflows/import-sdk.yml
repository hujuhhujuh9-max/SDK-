name: Import SDK archive

on:
  push:
    branches:
      - sdk/flutter-3.44.8
      - sdk/renpy-8.5.3
      - sdk/renpy-rapt-8.5.3
    paths:
      - .github/workflows/import-sdk.yml
      - scripts/import_sdk_archive.py
      - components/**/manifest.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sdk-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'hujuhhujuh9-max/SDK-' && startsWith(github.ref, 'refs/heads/sdk/')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      SDK_BRANCH: ${{ github.ref_name }}
      BASE_MAIN_SHA: 91f491f9841abba85b65a88f233c5dd7e5e70043
    steps:
      - name: Check out this component branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          lfs: false
      - name: Initialize Git LFS
        run: git lfs install --local
      - name: Select the component and protect main
        shell: bash
        run: |
          set -euo pipefail
          case "$SDK_BRANCH" in
            sdk/flutter-3.44.8) component=flutter ;;
            sdk/renpy-8.5.3) component=renpy ;;
            sdk/renpy-rapt-8.5.3) component=renpy-rapt ;;
            *) echo 'Unexpected branch'; exit 1 ;;
          esac
          test "$(git branch --show-current)" = "$SDK_BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo "SDK_COMPONENT=$component" >> "$GITHUB_ENV"
      - name: Download the archive and verify its size and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/import_sdk_archive.py --component "$SDK_COMPONENT"
      - name: Publish only this component branch through Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "components/$SDK_COMPONENT/archives"
          if git diff --cached --quiet; then
            echo 'Archive is already imported.'
            exit 0
          fi
          git commit -m "Import verified $SDK_COMPONENT SDK archive"
          git lfs fsck
          git lfs push origin "$SDK_BRANCH"
          git push origin "HEAD:refs/heads/$SDK_BRANCH"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE_MAIN_SHA"
          echo "Imported $SDK_COMPONENT; main is unchanged." >> "$GITHUB_STEP_SUMMARY"
