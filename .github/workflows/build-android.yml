name: Build RenPy-owned Android runner

on:
  workflow_dispatch:
    inputs:
      force_flutter_build:
        description: Rebuild the Flutter AAR instead of reusing verified output
        type: boolean
        default: false
      build_app_starter:
        description: Also package and verify the opt-in app startup template
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_flutter_build:
        description: Rebuild the Flutter AAR instead of reusing verified output
        type: boolean
        default: false
      verify_flutter_reuse:
        description: Verify warm and Python-only AAR reuse after the combined build
        type: boolean
        default: false
      build_app_starter:
        description: Build story and app variants from the same source and verified AAR
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-runner-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/integration/abc-app-recipes' || github.ref == 'refs/heads/integration/app-starter' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/app/build.gradle
            flutter/pubspec.lock
            sdk-lock.json
      - name: Add Android command-line tools to PATH
        run: |
          sdk_tools_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if ! test -x "$sdk_tools_bin/sdkmanager"; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if test -x "$candidate/sdkmanager"; then sdk_tools_bin="$candidate"; break; fi
            done
          fi
          test -x "$sdk_tools_bin/sdkmanager"
          echo "$sdk_tools_bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Install build requirements
        run: |
          python3 -m venv .android-build/venv
          .android-build/venv/bin/python -m pip install -r requirements-build.txt -r runtime/requirements.txt
          if ! command -v ffmpeg >/dev/null || ! command -v Xvfb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg xvfb
          fi
          # Install the plugin toolchain before checking the AAR receipt.
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Restore verified SDK inputs
        id: sdk-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .android-build/sdks
            .android-build/source.git
          key: ${{ runner.os }}-sdk-inputs-${{ hashFiles('sdk-lock.json') }}
          restore-keys: ${{ runner.os }}-sdk-inputs-
      - name: Prepare verified SDK inputs
        run: .android-build/venv/bin/python prepare.py setup
      - name: Cache verified SDK inputs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .android-build/sdks
            .android-build/source.git
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Restore Flutter AAR candidate
        id: flutter-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .android-build/flutter-aar
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-aar-v1-${{ hashFiles('build_android.py', 'sdk-lock.json', 'flutter/**', 'runtime/flet_extensions.json') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-flutter-aar-v1-
      - name: Test preparation and build the fixed runner
        env:
          BUILD_APP_STARTER: ${{ inputs.build_app_starter && 'true' || 'false' }}
        run: |
          .android-build/venv/bin/python -m unittest discover -s tests -v
          git fetch --depth 1 origin b17a816144899665919462cd5d68e737c3fe0c6a
          git show b17a816144899665919462cd5d68e737c3fe0c6a:game/script.rpy > .android-build/baseline-story.rpy
          .android-build/venv/bin/python scripts/check_native_story.py --baseline-game-script .android-build/baseline-story.rpy
          .android-build/venv/bin/python examples/renpy/verify.py
          if test "$BUILD_APP_STARTER" = true; then
            .android-build/venv/bin/python scripts/check_native_story.py --startup-template app --output .android-build/app-native-story-check
          fi
          .android-build/venv/bin/python build_android.py --startup-template story ${{ inputs.force_flutter_build && '--force-flutter-build' || '' }}
      - name: Package the app starter using the same verified Flutter AAR
        if: inputs.build_app_starter
        run: .android-build/venv/bin/python build_android.py --startup-template app
      - name: Verify warm Flutter output reuse
        if: inputs.verify_flutter_reuse
        run: .android-build/venv/bin/python scripts/check_flutter_reuse.py
      - name: Cache verified Flutter AAR
        if: steps.flutter-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .android-build/flutter-aar
          key: ${{ steps.flutter-cache.outputs.cache-primary-key }}
      - name: Upload native story checks
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-story-check
          path: |
            .android-build/native-story-check/*.json
            .android-build/native-story-check/*.log
            .android-build/native-story-check/*.png
            .android-build/d-native-example-check/
            .android-build/renpy-examples-check/
            .android-build/app-native-story-check/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-apk
          path: |
            .android-build/outputs/runner-debug.apk
            .android-build/outputs/apk-builds.json
            .android-build/outputs/flutter-cache-reuse.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload emulator APK
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-emulator-apk
          path: |
            .android-build/outputs/runner-debug-x86_64.apk
            .android-build/outputs/apk-builds.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload resolved dependencies
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-dependencies
          if-no-files-found: warn
          include-hidden-files: true
          path: .android-build/integration/flutter/pubspec.lock
      - name: Upload app starter APK
        if: success() && inputs.build_app_starter
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-app-apk
          path: |
            .android-build/outputs/runner-app-debug.apk
            .android-build/outputs/apk-builds-app.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload app starter emulator APK
        if: success() && inputs.build_app_starter
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-app-emulator-apk
          path: |
            .android-build/outputs/runner-app-debug-x86_64.apk
            .android-build/outputs/apk-builds-app.json
          if-no-files-found: error
          include-hidden-files: true
