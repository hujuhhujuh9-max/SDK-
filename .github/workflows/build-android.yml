name: Build RenPy-owned Android runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-android.yml
      - build_android.py
      - prepare.py
      - sdk-lock.json
      - requirements-build.txt
      - android/**
      - flutter/**
      - game/**
      - runtime/**
      - scripts/check_flet_bridge.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-runner-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/app/build.gradle
            flutter/pubspec.lock
            sdk-lock.json
      - name: Add Android command-line tools to PATH
        run: |
          sdk_tools_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if ! test -x "$sdk_tools_bin/sdkmanager"; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if test -x "$candidate/sdkmanager"; then sdk_tools_bin="$candidate"; break; fi
            done
          fi
          test -x "$sdk_tools_bin/sdkmanager"
          echo "$sdk_tools_bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Install build requirements
        run: |
          python3 -m venv .android-build/venv
          .android-build/venv/bin/python -m pip install -r requirements-build.txt -r runtime/requirements.txt
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - name: Restore verified SDK inputs
        id: sdk-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .android-build/sdks
            .android-build/source.git
          key: ${{ runner.os }}-sdk-inputs-${{ hashFiles('sdk-lock.json') }}
          restore-keys: ${{ runner.os }}-sdk-inputs-
      - name: Prepare verified SDK inputs
        run: .android-build/venv/bin/python prepare.py setup
      - name: Cache verified SDK inputs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .android-build/sdks
            .android-build/source.git
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Test preparation and build the fixed runner
        run: |
          .android-build/venv/bin/python -m unittest discover -s tests -v
          .android-build/venv/bin/python build_android.py
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-apk
          path: .android-build/outputs/runner-debug.apk
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload resolved dependencies
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-dependencies
          if-no-files-found: warn
          include-hidden-files: true
          path: .android-build/integration/flutter/pubspec.lock
