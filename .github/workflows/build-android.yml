name: Build RenPy-owned Android runner

on:
  workflow_dispatch:
    inputs:
      force_flutter_build:
        description: Rebuild the Flutter AAR instead of reusing verified output
        type: boolean
        default: false
      build_app_starter:
        description: Also package and verify the opt-in app startup template
        type: boolean
        default: false
      verify_project_release:
        description: Generate another project and verify signed release APKs with a disposable CI key
        type: boolean
        default: false
  workflow_call:
    inputs:
      force_flutter_build:
        description: Rebuild the Flutter AAR instead of reusing verified output
        type: boolean
        default: false
      verify_flutter_reuse:
        description: Verify warm and Python-only AAR reuse after the combined build
        type: boolean
        default: false
      build_app_starter:
        description: Build story and app variants from the same source and verified AAR
        type: boolean
        default: false
      verify_project_release:
        description: Verify the external project template and release APK packaging
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-runner-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/integration/abc-app-recipes' || github.ref == 'refs/heads/integration/app-starter' }}

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          lfs: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            android/app/build.gradle
            flutter/pubspec.lock
            sdk-lock.json
      - name: Add Android command-line tools to PATH
        run: |
          sdk_tools_bin="$ANDROID_HOME/cmdline-tools/latest/bin"
          if ! test -x "$sdk_tools_bin/sdkmanager"; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin; do
              if test -x "$candidate/sdkmanager"; then sdk_tools_bin="$candidate"; break; fi
            done
          fi
          test -x "$sdk_tools_bin/sdkmanager"
          echo "$sdk_tools_bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
      - name: Install build requirements
        run: |
          python3 -m venv .android-build/venv
          .android-build/venv/bin/python -m pip install -r requirements-build.txt -r runtime/requirements.txt
          if ! command -v ffmpeg >/dev/null || ! command -v Xvfb >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg xvfb
          fi
          # Install the plugin toolchain before checking the AAR receipt.
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Restore verified SDK inputs
        id: sdk-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .android-build/sdks
            .android-build/source.git
          key: ${{ runner.os }}-sdk-inputs-${{ hashFiles('sdk-lock.json') }}
          restore-keys: ${{ runner.os }}-sdk-inputs-
      - name: Prepare verified SDK inputs
        run: .android-build/venv/bin/python prepare.py setup
      - name: Cache verified SDK inputs
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .android-build/sdks
            .android-build/source.git
          key: ${{ steps.sdk-cache.outputs.cache-primary-key }}
      - name: Identify installed Flutter build toolchain
        id: flutter-toolchain
        run: .android-build/venv/bin/python scripts/ci_flutter_cache.py toolchain >> "$GITHUB_OUTPUT"
      - name: Restore Flutter AAR candidate
        id: flutter-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .android-build/flutter-aar
          # A fresh key allows repaired output to replace an immutable stale entry.
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-aar-v2-${{ steps.flutter-toolchain.outputs.fingerprint }}-${{ hashFiles('build_android.py', 'sdk-lock.json', 'flutter/**', 'runtime/flet_extensions.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-flutter-aar-v2-${{ steps.flutter-toolchain.outputs.fingerprint }}-${{ hashFiles('build_android.py', 'sdk-lock.json', 'flutter/**', 'runtime/flet_extensions.json') }}-
            ${{ runner.os }}-${{ runner.arch }}-flutter-aar-v2-${{ steps.flutter-toolchain.outputs.fingerprint }}-
      - name: Record verified Flutter AAR candidate
        id: flutter-before
        run: .android-build/venv/bin/python scripts/ci_flutter_cache.py candidate >> "$GITHUB_OUTPUT"
      - name: Test preparation and build the fixed runner
        env:
          BUILD_APP_STARTER: ${{ inputs.build_app_starter && 'true' || 'false' }}
        run: |
          .android-build/venv/bin/python -m unittest discover -s tests -v
          git fetch --depth 1 origin b17a816144899665919462cd5d68e737c3fe0c6a
          git show b17a816144899665919462cd5d68e737c3fe0c6a:game/script.rpy > .android-build/baseline-story.rpy
          .android-build/venv/bin/python scripts/check_native_story.py --baseline-game-script .android-build/baseline-story.rpy
          .android-build/venv/bin/python examples/renpy/verify.py
          if test "$BUILD_APP_STARTER" = true; then
            .android-build/venv/bin/python scripts/check_native_story.py --startup-template app --output .android-build/app-native-story-check
          fi
          .android-build/venv/bin/python build_android.py --startup-template story ${{ inputs.force_flutter_build && '--force-flutter-build' || '' }}
      - name: Package the app starter using the same verified Flutter AAR
        if: inputs.build_app_starter
        run: .android-build/venv/bin/python build_android.py --startup-template app
      - name: Verify warm Flutter output reuse
        if: inputs.verify_flutter_reuse
        run: .android-build/venv/bin/python scripts/check_flutter_reuse.py
      - name: Verify Flutter AAR before publication
        id: flutter-after
        run: .android-build/venv/bin/python scripts/ci_flutter_cache.py publish >> "$GITHUB_OUTPUT"
      - name: Cache verified Flutter AAR
        if: steps.flutter-before.outputs.receipt != steps.flutter-after.outputs.receipt
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .android-build/flutter-aar
          key: ${{ steps.flutter-cache.outputs.cache-primary-key }}
      - name: Prepare Flutter cache restoration check
        if: inputs.verify_flutter_reuse && steps.flutter-before.outputs.receipt != steps.flutter-after.outputs.receipt
        run: .android-build/venv/bin/python -c 'import shutil; shutil.rmtree(".android-build/flutter-aar")'
      - name: Restore published Flutter AAR
        if: inputs.verify_flutter_reuse && steps.flutter-before.outputs.receipt != steps.flutter-after.outputs.receipt
        id: flutter-published
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .android-build/flutter-aar
          key: ${{ steps.flutter-cache.outputs.cache-primary-key }}
      - name: Verify published Flutter AAR restoration
        if: inputs.verify_flutter_reuse && steps.flutter-before.outputs.receipt != steps.flutter-after.outputs.receipt
        env:
          RESTORED_EXACT_KEY: ${{ steps.flutter-published.outputs.cache-hit }}
          EXPECTED_RECEIPT: ${{ steps.flutter-after.outputs.receipt }}
        run: |
          test "$RESTORED_EXACT_KEY" = true
          restored_receipt=$(.android-build/venv/bin/python scripts/ci_flutter_cache.py publish)
          test "$restored_receipt" = "receipt=$EXPECTED_RECEIPT"
          echo "Passed: published Flutter AAR restored with identical verified contents"
      - name: Identify installed release build toolchain
        if: inputs.verify_project_release
        id: release-toolchain
        run: .android-build/venv/bin/python scripts/ci_flutter_cache.py toolchain >> "$GITHUB_OUTPUT"
      - name: Restore Flutter release AAR candidate
        if: inputs.verify_project_release
        id: release-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .android-build/flutter-aar-release
          key: ${{ runner.os }}-${{ runner.arch }}-flutter-aar-release-v1-${{ steps.release-toolchain.outputs.fingerprint }}-${{ hashFiles('build_android.py', 'sdk-lock.json', 'flutter/**', 'runtime/flet_extensions.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-flutter-aar-release-v1-${{ steps.release-toolchain.outputs.fingerprint }}-${{ hashFiles('build_android.py', 'sdk-lock.json', 'flutter/**', 'runtime/flet_extensions.json') }}-
            ${{ runner.os }}-${{ runner.arch }}-flutter-aar-release-v1-${{ steps.release-toolchain.outputs.fingerprint }}-
      - name: Record verified Flutter release candidate
        if: inputs.verify_project_release
        id: release-before
        run: .android-build/venv/bin/python scripts/ci_flutter_cache.py candidate --build-type release >> "$GITHUB_OUTPUT"
      - name: Build the external project in release mode
        if: inputs.verify_project_release
        run: |
          .android-build/venv/bin/python create_project.py .android-build/project-example --package org.renfletpy.example --name 'RenFletPy Example'
          .android-build/venv/bin/python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          project = Path(".android-build/project-example")
          shutil.copyfile(".android-build/integration/flet/client/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png",
                          project / "icon.png")
          config = project / "renfletpy.json"
          values = json.loads(config.read_text())
          values["icon"] = "icon.png"
          config.write_text(json.dumps(values, indent=2) + "\n")
          # Exercise edited app, asset and native sources outside the SDK.
          (project / "assets/runner.svg").rename(project / "assets/project-badge.svg")
          home = project / "app/my_app.py"
          home.write_text(home.read_text().replace('src="runner.svg"', 'src="project-badge.svg"'))
          native = project / "game/app_starter.rpy"
          source = native.read_text()
          needle = 'label app_recipe_story:\n'
          if source.count(needle) != 1:
              raise SystemExit("The project story fixture must have one callable entry")
          source = source.replace(needle, needle + '    $ print("SDK_RUNNER_PROJECT_STORY pid=%s" % os.getpid(), flush=True)\n')
          source = source.replace('Someone left a folded note at the lighthouse. The tide will be back before sunset.',
                                  'This note belongs to the generated RenFletPy project.')
          native.write_text(source)
          PY
          export RENFLETPY_KEYSTORE="$PWD/.android-build/project-release-ci.jks"
          export RENFLETPY_KEY_ALIAS=renfletpy-ci
          export RENFLETPY_STORE_PASSWORD="$(openssl rand -hex 24)"
          export RENFLETPY_KEY_PASSWORD="$RENFLETPY_STORE_PASSWORD"
          echo "::add-mask::$RENFLETPY_STORE_PASSWORD"
          trap 'rm -f "$RENFLETPY_KEYSTORE"' EXIT
          keytool -genkeypair -keystore "$RENFLETPY_KEYSTORE" -alias "$RENFLETPY_KEY_ALIAS" -storepass:env RENFLETPY_STORE_PASSWORD -keypass:env RENFLETPY_KEY_PASSWORD -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=RenFletPy CI disposable key'
          .android-build/venv/bin/python build_android.py --project .android-build/project-example/renfletpy.json --build-type release
          .android-build/venv/bin/python scripts/check_flutter_reuse.py --build-type release
          if test "$GITHUB_REF" = refs/heads/integration/api35-records; then
            .android-build/venv/bin/python - <<'PY'
          import json
          import shutil
          from pathlib import Path
          project = Path(".android-build/project-api35")
          shutil.copytree(".android-build/project-example", project)
          config = project / "renfletpy.json"
          values = json.loads(config.read_text())
          # Disposable CI signing keys cannot update the previously installed
          # release. A separate package preserves that app and its saved data.
          values.update(application_id="org.renfletpy.api35", display_name="RenFletPy API 35 Test",
                        version_code=2, version_name="0.1.1")
          config.write_text(json.dumps(values, indent=2) + "\n")
          PY
            .android-build/venv/bin/python build_android.py --project .android-build/project-api35/renfletpy.json --build-type release
          fi
      - name: Verify Flutter release AAR before publication
        if: inputs.verify_project_release
        id: release-after
        run: .android-build/venv/bin/python scripts/ci_flutter_cache.py publish --build-type release >> "$GITHUB_OUTPUT"
      - name: Cache verified Flutter release AAR
        if: inputs.verify_project_release && steps.release-before.outputs.receipt != steps.release-after.outputs.receipt
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .android-build/flutter-aar-release
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
      - name: Prepare Flutter release restoration check
        if: inputs.verify_project_release && steps.release-before.outputs.receipt != steps.release-after.outputs.receipt
        run: .android-build/venv/bin/python -c 'import shutil; shutil.rmtree(".android-build/flutter-aar-release")'
      - name: Restore published Flutter release AAR
        if: inputs.verify_project_release && steps.release-before.outputs.receipt != steps.release-after.outputs.receipt
        id: release-published
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .android-build/flutter-aar-release
          key: ${{ steps.release-cache.outputs.cache-primary-key }}
      - name: Verify published Flutter release restoration
        if: inputs.verify_project_release && steps.release-before.outputs.receipt != steps.release-after.outputs.receipt
        env:
          RESTORED_EXACT_KEY: ${{ steps.release-published.outputs.cache-hit }}
          EXPECTED_RECEIPT: ${{ steps.release-after.outputs.receipt }}
        run: |
          test "$RESTORED_EXACT_KEY" = true
          restored_receipt=$(.android-build/venv/bin/python scripts/ci_flutter_cache.py publish --build-type release)
          test "$restored_receipt" = "receipt=$EXPECTED_RECEIPT"
          echo "Passed: published Flutter release AAR restored with identical verified contents"
      - name: Upload native story checks
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: native-story-check
          path: |
            .android-build/native-story-check/*.json
            .android-build/native-story-check/*.log
            .android-build/native-story-check/*.png
            .android-build/d-native-example-check/
            .android-build/renpy-examples-check/
            .android-build/app-native-story-check/
          include-hidden-files: true
          if-no-files-found: warn
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-apk
          path: |
            .android-build/outputs/runner-debug.apk
            .android-build/outputs/apk-builds.json
            .android-build/outputs/flutter-cache-reuse.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload emulator APK
        if: success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-emulator-apk
          path: |
            .android-build/outputs/runner-debug-x86_64.apk
            .android-build/outputs/apk-builds.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload resolved dependencies
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-dependencies
          if-no-files-found: warn
          include-hidden-files: true
          path: .android-build/integration/flutter/pubspec.lock
      - name: Upload app starter APK
        if: success() && inputs.build_app_starter
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-app-apk
          path: |
            .android-build/outputs/runner-app-debug.apk
            .android-build/outputs/apk-builds-app.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload app starter emulator APK
        if: success() && inputs.build_app_starter
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: runner-app-emulator-apk
          path: |
            .android-build/outputs/runner-app-debug-x86_64.apk
            .android-build/outputs/apk-builds-app.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload example release APKs
        if: success() && inputs.verify_project_release
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: project-release-apks
          path: |
            .android-build/outputs/runner-org-renfletpy-example-release.apk
            .android-build/outputs/apk-builds-org-renfletpy-example-release.json
            .android-build/outputs/flutter-cache-reuse-release.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload example release emulator APK
        if: success() && inputs.verify_project_release
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: project-release-emulator-apk
          path: |
            .android-build/outputs/runner-org-renfletpy-example-release-x86_64.apk
            .android-build/outputs/apk-builds-org-renfletpy-example-release.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload phone retest APK
        if: success() && inputs.verify_project_release && github.ref == 'refs/heads/integration/api35-records'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: api35-phone-retest-apk
          path: |
            .android-build/outputs/runner-org-renfletpy-api35-release.apk
            .android-build/outputs/apk-builds-org-renfletpy-api35-release.json
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload phone retest emulator APK
        if: success() && inputs.verify_project_release && github.ref == 'refs/heads/integration/api35-records'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: api35-phone-retest-emulator-apk
          path: |
            .android-build/outputs/runner-org-renfletpy-api35-release-x86_64.apk
            .android-build/outputs/apk-builds-org-renfletpy-api35-release.json
          if-no-files-found: error
          include-hidden-files: true
