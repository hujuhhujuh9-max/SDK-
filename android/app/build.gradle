plugins { id "com.android.application" }

android {
    namespace "org.sdk.runner"
    compileSdk 36
    defaultConfig {
        applicationId "org.sdk.runner"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
        ndk { abiFilters "arm64-v8a", "armeabi-v7a", "x86_64" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging { jniLibs { useLegacyPackaging = true } }
    androidResources { noCompress += ["mp3", "rpyc", "ttf"] }
}

dependencies {
    implementation project(":renpyandroid")
    implementation "org.sdk.fixed_flet:flutter_debug:1.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.9.3"
    implementation "androidx.appcompat:appcompat:1.7.1"
}
